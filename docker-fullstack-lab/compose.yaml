name: docker-fullstack-lab

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notesdb}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
      - app_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   #---------
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""] #---
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - data
    restart: unless-stopped

  migrate:
    image: docker-fullstack-lab-api:local
    command: ["node", "src/migrate.js"]
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-notesdb}
      DB_USER: notesapp
      DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  api:
    image: docker-fullstack-lab-api:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-notesdb}
      DB_USER: notesapp
      DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - app_db_password
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - web
      - data
    restart: unless-stopped

  frontend:
    image: docker-fullstack-lab-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"  # what is this -3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - web
    restart: unless-stopped

networks:
  web:
  data:
    internal: true

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  app_db_password:
    file: ./secrets/app_db_password.txt
